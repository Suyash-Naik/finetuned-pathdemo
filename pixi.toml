[workspace]
channels = ["conda-forge"]
name = "finetuned-pathdemo"

platforms = [
  "linux-64",
  "win-64"]

version = "0.1.0"


[tasks.jupyter-start]
cmd = "jupyter lab"
description = "Start JupyterLab"

[dependencies]
python = "3.11.*"
awscli = ">=2.36.8,<3"
jupyterlab = ">=4.6.2,<5"
pandas = ">=3.0.3,<4"
scikit-image = ">=0.26.0,<0.27"
scikit-learn = ">=1.9.0,<2"
seaborn = ">=0.13.2,<0.14"

napari = ">=0.8.0,<0.9"
pyqt6 = ">=6.8.1,<7"
plotly = ">=6.9.0,<7"
huggingface_hub = ">=1.26.0,<2"


[pypi-dependencies]
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cu132" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cu132" }
torchstain = ">=1.4.1, <2"
timm = ">=1.0.28, <2"
captum = ">=0.9.0, <0.10"
bioio = ">=3.5.0, <4"
bioio-ome-tiff = ">=1.4.0, <2"
bioio-tifffile = ">=1.3.0, <2"

[activation.env]
PYTHONPATH = "./src"
